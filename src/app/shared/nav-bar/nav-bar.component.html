<header class="nav">
  <div class="nav__row">
    <a routerLink="/" class="nav__brand" (click)="closeMenu()">
      <span class="nav__brand-mark">Rana<em>Cafe</em></span>
    </a>

    <button
      class="nav__toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav__links" [class.nav__links--open]="menuOpen()">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      <a routerLink="/about" routerLinkActive="is-active" (click)="closeMenu()">About</a>
      <a routerLink="/reviews" routerLinkActive="is-active" (click)="closeMenu()">Reviews</a>
      <a routerLink="/about" class="nav__cta" (click)="closeMenu()">Visit us</a>
    </nav>
  </div>
</header>
